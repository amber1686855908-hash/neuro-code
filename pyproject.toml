[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neuro-code"
version = "0.1.0.dev0"
description = "An extensible Python terminal coding agent"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Neuro Code contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "agent-client-protocol>=0.11.0,<0.12",
  "httpx>=0.28,<1",
  "mcp>=1.28.1,<2",
  "pydantic>=2.10,<3",
  "textual>=1.0,<2",
]

[project.optional-dependencies]
tui = []
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "textual>=1.0,<2",
]

[project.scripts]
neuro = "neuro_code.cli:main"
neuro-code = "neuro_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_code"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "DTZ", "LOG", "PIE", "PT", "RUF", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["PT009", "PT027"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["neuro_code"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not live'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "contract: shared adapter contract tests",
  "differential: tests that compare the Rust oracle",
  "live: opt-in tests that require external credentials, network access, and may incur charges",
  "terminal: opt-in tests that require a native terminal or PTY",
]

[tool.coverage.run]
branch = true
source = ["neuro_code"]

[tool.coverage.report]
fail_under = 85
show_missing = true
