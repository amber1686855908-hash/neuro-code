name: macOS sandbox evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/macos-sandbox-evidence.yml"
      - "tests/security/macos_sandbox_probe.py"
      - "tests/security/macos_hardlink_mode_probe.py"
      - "tests/security/hardlink_mode_probe_common.py"
      - "src/neuro_code/infrastructure/sandbox/**"
      - "src/neuro_code/application/ports/sandbox.py"
      - "src/neuro_code/domain/sandbox/**"

permissions:
  contents: read

jobs:
  macos-sandbox-evidence:
    name: macOS sandbox evidence (${{ matrix.runner }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep both architecture families explicit; do not silently replace
        # Intel evidence with a floating macos-latest label.
        runner: [macos-15, macos-15-intel]
        # Run the actual workload evidence on both supported Python runtimes;
        # ordinary macOS CI is not a substitute for this OS-level matrix.
        python: ["3.12", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install the locked test environment
        run: uv sync --locked --extra dev

      - name: Run macOS OS-level evidence probe
        id: probe
        continue-on-error: true
        env:
          REPORT: ${{ runner.temp }}/neuro-code-macos-sandbox-evidence.json
        run: |
          set -o pipefail
          uv run python tests/security/macos_sandbox_probe.py \
            --mode full \
            --report "$REPORT" | tee "$RUNNER_TEMP/probe-summary.json"

      - name: Upload capability report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: macos-sandbox-evidence-${{ matrix.runner }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/neuro-code-macos-sandbox-evidence.json
            ${{ runner.temp }}/probe-summary.json
          if-no-files-found: error

      - name: Probe cross-root hardlink mode semantics (evidence only)
        if: always()
        env:
          REPORT: ${{ runner.temp }}/neuro-code-macos-hardlink-mode.json
        run: uv run python tests/security/macos_hardlink_mode_probe.py --report "$REPORT"

      - name: Upload cross-root hardlink evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: macos-hardlink-mode-${{ matrix.runner }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/neuro-code-macos-hardlink-mode.json
          if-no-files-found: error
      - name: Upload concurrent hardlink evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: macos-hardlink-concurrent-${{ matrix.runner }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/neuro-code-macos-hardlink-mode.json
          if-no-files-found: error

      - name: Require an explicit probe result
        if: always()
        env:
          REPORT: ${{ runner.temp }}/neuro-code-macos-sandbox-evidence.json
        run: |
          test -f "$REPORT"
          status="$(uv run python -c 'import json, os; print(json.load(open(os.environ["REPORT"], encoding="utf-8"))["status"])')"
          echo "macOS sandbox evidence status: $status"
          # Capability failures are deliberately a failed gate, not a skip.
          # A PASS is required before production macOS design can begin.
          test "$status" = PASS
