name: Windows AppContainer IPC POC1B (evidence only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-appcontainer-ipc-poc1b.yml"
      - "scripts/evidence/windows_appcontainer_ipc_poc1b.py"
      - "scripts/evidence/windows_appcontainer_ipc_poc1b_child.c"

permissions:
  contents: read

jobs:
  appcontainer-ipc:
    name: AppContainer IPC (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Compile evidence-only native IPC probe
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) {
            throw "Visual C++ toolchain not found"
          }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell `
            -VsInstallPath $installation `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=amd64 -host_arch=amd64"
          cl.exe /nologo /W4 /WX /MT /DUNICODE /D_UNICODE `
            scripts/evidence/windows_appcontainer_ipc_poc1b_child.c `
            /Fe:"${env:RUNNER_TEMP}\windows_appcontainer_ipc_poc1b_child.exe" `
            /link advapi32.lib userenv.lib `
            2>&1 | Tee-Object -FilePath "${env:RUNNER_TEMP}\appcontainer-ipc-poc1b-build.txt"
          if ($LASTEXITCODE -ne 0) {
            throw "Native evidence child compilation failed with $LASTEXITCODE"
          }
      - name: Execute AppContainer IPC gates
        shell: pwsh
        run: |
          uv run python scripts/evidence/windows_appcontainer_ipc_poc1b.py `
            --child "${env:RUNNER_TEMP}\windows_appcontainer_ipc_poc1b_child.exe" `
            --report "${env:RUNNER_TEMP}\windows-appcontainer-ipc-poc1b.json"
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-appcontainer-ipc-poc1b-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/appcontainer-ipc-poc1b-build.txt
            ${{ runner.temp }}/windows-appcontainer-ipc-poc1b.json
          if-no-files-found: error
