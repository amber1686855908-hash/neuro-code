name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run pytest

  terminal-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      NEURO_CODE_RUN_TERMINAL_SMOKE: "1"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run pytest tests/test_terminal_smoke.py

  linux-sandbox-integration:
    # Pin 22.04: ubuntu-latest currently resolves to 24.04, whose default
    # AppArmor user-namespace restriction can deny Bubblewrap capabilities.
    # This security gate must execute the boundary, not pass by skipping it.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      NEURO_CODE_REQUIRE_SANDBOX_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install and identify Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          bwrap --version
          sysctl kernel.unprivileged_userns_clone
      - run: uv sync --extra dev --locked
      - name: Record Linux pidfd runtime capability
        run: |
          uv run python - <<'PY'
          import os
          import platform
          import signal
          import sys

          print("sys.version:", sys.version.replace("\\n", " "))
          print("sys.executable:", sys.executable)
          print("platform.platform:", platform.platform())
          print("os.uname:", os.uname())
          print("has os.pidfd_open:", hasattr(os, "pidfd_open"))
          print("has signal.pidfd_send_signal:", hasattr(signal, "pidfd_send_signal"))
          print("uv-managed prefix:", sys.prefix)
          PY
      - name: Prove Linux child sandbox boundaries (Python ${{ matrix.python }})
        run: >-
          uv run pytest
          tests/security/test_linux_sandbox_integration.py
          -m sandbox_integration
          -q -rs
          --junitxml=/tmp/neuro-code-linux-sandbox-${{ matrix.python }}.xml
      - name: Require every Linux security test to execute
        run: |
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET

          path = "/tmp/neuro-code-linux-sandbox-${{ matrix.python }}.xml"
          root = ET.parse(path).getroot()
          suites = root.findall(".//testsuite")
          tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          print(f"executed={tests} skipped={skipped}")
          if tests == 0 or skipped:
              raise SystemExit("Linux sandbox security gate did not execute every test")
          PY

  macos-seatbelt-integration:
    name: macOS Seatbelt (${{ matrix.runner }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      NEURO_CODE_REQUIRE_MACOS_SANDBOX_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Record macOS Seatbelt runtime facts
        run: |
          set -o pipefail
          test -x /usr/bin/sandbox-exec
          {
            sw_vers
            uname -a
            uname -m
            printf 'sandbox-exec='
            /usr/bin/python3 -c 'from pathlib import Path; print(Path("/usr/bin/sandbox-exec").resolve())'
            ls -l /usr/bin/sandbox-exec
            /usr/bin/codesign -dv --verbose=2 /usr/bin/sandbox-exec 2>&1
            csrutil status || true
          } | tee "$RUNNER_TEMP/neuro-code-macos-seatbelt-runtime.txt"
      - name: Prove macOS Seatbelt production adapter boundaries
        run: >-
          uv run pytest
          tests/security/test_macos_sandbox_integration.py
          -m sandbox_integration
          -q -rs
          --junitxml=${{ runner.temp }}/neuro-code-macos-seatbelt-${{ matrix.python }}.xml
      - name: Require every macOS security test to execute
        if: always()
        run: |
          uv run python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "neuro-code-macos-seatbelt-${{ matrix.python }}.xml",
          )
          root = ET.parse(path).getroot()
          suites = root.findall(".//testsuite")
          if root.tag == "testsuite":
              suites.append(root)
          tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          print(f"executed={tests} skipped={skipped}")
          if tests == 0 or skipped:
              raise SystemExit("macOS Seatbelt security gate did not execute every test")
          PY
      - name: Upload macOS Seatbelt integration facts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: macos-seatbelt-${{ matrix.runner }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/neuro-code-macos-seatbelt-runtime.txt
            ${{ runner.temp }}/neuro-code-macos-seatbelt-${{ matrix.python }}.xml
          if-no-files-found: error

  windows-process-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      NEURO_CODE_RUN_TERMINAL_SMOKE: "1"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Prove native Job Object and ConPTY lifecycle
        run: >-
          uv run pytest
          tests/test_process_tree.py::WindowsProcessTreeIntegrationTests
          tests/test_background_tasks.py::LocalBackgroundTaskManagerTests::test_windows_shutdown_terminates_atomically_owned_descendant
          tests/test_terminal_smoke.py::test_production_cli_ctrl_keys_resize_and_restore_through_windows_conpty
          tests/test_terminal_smoke.py::test_windows_conpty_reports_resize_and_preserves_nonzero_exit
          -q -rs

  windows-native-sandbox-security:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Prove native W1 token and W2 setup authority contracts
        run: >-
          uv run pytest
          tests/test_windows_security_token.py
          tests/test_windows_sandbox_accounts.py
          tests/test_windows_sandbox_setup.py
          -q -rs

  windows-native-sandbox-native-acceptance:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NEURO_CODE_RUN_NATIVE_WINDOWS_SANDBOX_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Prove real-user ACL, DPAPI DACL and SID-scoped Firewall authority
        run: >-
          uv run pytest
          tests/security/test_windows_sandbox_native_acceptance.py
          -q -rs

  windows-native-sandbox-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEURO_CODE_RUN_NATIVE_WINDOWS_SANDBOX_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Prove final restricted-child Windows W3 runtime
        run: >-
          uv run pytest
          tests/security/test_windows_native_runtime_acceptance.py
          -q -rs -s
          --junitxml=${{ runner.temp }}/neuro-code-windows-native-runtime.xml
      - name: Require W3 native acceptance execution
        shell: pwsh
        env:
          W3_JUNIT: ${{ runner.temp }}/neuro-code-windows-native-runtime.xml
        run: |
          [xml]$report = Get-Content $env:W3_JUNIT
          $cases = @($report.testsuites.testsuite.testcase)
          $skipped = @($cases | Where-Object { $_.skipped }).Count
          Write-Host "executed=$($cases.Count) skipped=$skipped"
          if ($cases.Count -eq 0 -or $skipped -ne 0) {
            throw "Windows W3 native acceptance did not execute every test"
          }

  windows-native-sandbox-pty:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEURO_CODE_RUN_NATIVE_WINDOWS_SANDBOX_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Prove W4 Gate 1 restricted ConPTY evidence
        run: >-
          uv run pytest
          tests/security/test_windows_native_pty_acceptance.py
          -k "gate1 or malformed_resize"
          -q -rs -s
          --junitxml=${{ runner.temp }}/neuro-code-windows-native-pty-gate1.xml
      - name: Require W4 Gate 1 execution
        shell: pwsh
        env:
          W4_JUNIT: ${{ runner.temp }}/neuro-code-windows-native-pty-gate1.xml
        run: |
          [xml]$report = Get-Content $env:W4_JUNIT
          $cases = @($report.testsuites.testsuite.testcase)
          $skipped = @($cases | Where-Object { $_.skipped }).Count
          Write-Host "executed=$($cases.Count) skipped=$skipped"
          if ($cases.Count -ne 3 -or $skipped -ne 0) {
            throw "Windows W4 Gate 1 did not execute every focused test"
          }
      - name: Prove W4 Gate 2 PTY write and network isolation
        run: >-
          uv run pytest
          tests/security/test_windows_native_pty_acceptance.py::WindowsNativePtyAcceptanceTests::test_z_gate2_pty_write_and_network_isolation
          -q -rs -s
          --junitxml=${{ runner.temp }}/neuro-code-windows-native-pty-gate2.xml
      - name: Require W4 Gate 2 execution
        shell: pwsh
        env:
          W4_JUNIT: ${{ runner.temp }}/neuro-code-windows-native-pty-gate2.xml
        run: |
          [xml]$report = Get-Content $env:W4_JUNIT
          $cases = @($report.testsuites.testsuite.testcase)
          $skipped = @($cases | Where-Object { $_.skipped }).Count
          Write-Host "executed=$($cases.Count) skipped=$skipped"
          if ($cases.Count -ne 1 -or $skipped -ne 0) {
            throw "Windows W4 Gate 2 did not execute"
          }

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_docs_parity.py
      - run: uv run pytest --cov=neuro_code --cov-report=term-missing
      - run: uv build

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - run: uv venv --python 3.12 .wheel-smoke
      - run: uv pip install --python .wheel-smoke/bin/python dist/neuro_code-*.whl
      - run: .wheel-smoke/bin/python -m neuro_code --help
      - run: .wheel-smoke/bin/neuro --help
      - run: .wheel-smoke/bin/neuro-code --help
      - name: Verify removed compatibility modules stay absent
        run: |
          .wheel-smoke/bin/python - <<'PY'
          import importlib.util

          removed = (
              "neuro_code.runtime",
              "neuro_code.ports",
              "neuro_code.errors",
              "neuro_code.async_utils",
              "neuro_code.redaction",
              "neuro_code.providers",
              "neuro_code.providers.anthropic",
              "neuro_code.providers.failover",
              "neuro_code.providers.gemini",
              "neuro_code.providers.image_references",
              "neuro_code.providers.openai_compatible",
              "neuro_code.providers.openai_responses",
              "neuro_code.providers.xai_responses",
          )

          def exists(name: str) -> bool:
              try:
                  return importlib.util.find_spec(name) is not None
              except ModuleNotFoundError:
                  return False

          unexpected = [name for name in removed if exists(name)]
          assert not unexpected, f"unexpected compatibility modules: {unexpected}"
          PY
